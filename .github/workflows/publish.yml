# 配信まとめ(feed.json)を作って GitHub Pages に載せる。
#   - Milli Scene が「配信の状況が変わった」ときに repository_dispatch(update) で呼ぶ
#   - 呼ばれ損ねても古くなりすぎないよう、1時間に1回は自分でも作る
name: publish

on:
  repository_dispatch:
    types: [update]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: build
        run: node build.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          POLL_SEC: ${{ vars.POLL_SEC }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - if: steps.build.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.build.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - if: steps.build.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
